name: Build Android APK

# 把 ToEataGod 3.0 (PC / Ren'Py 8.5.3) 打包成 Android APK，全程在 GitHub 的
# x86_64 runner 上完成 —— 因为 Ren'Py 官方 Android 工具链（gradle + aapt2）
# 只提供 x86_64 宿主，手机本身编不了。
#
# 触发方式：
#   - 推送到 main
#   - 手动：Actions -> Build Android APK -> Run workflow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_build:
        description: "忽略 Ren'Py SDK 缓存，强制重新下载"
        type: boolean
        default: false

permissions:
  contents: write   # 用于把 APK 发布到 Release

jobs:
  apk:
    # 每次跑两个变体：正式包（740MB 游戏内容）和冒烟包（4.3MB 最小游戏，
    # 自带 Python 探针）。冒烟包只有 ~60MB，专门用于快速排查启动问题。
    strategy:
      fail-fast: false
      matrix:
        include:
          - smoke: "0"
            name: full
          - smoke: "1"
            name: smoke

    # concurrency 必须放在 job 级：matrix 上下文在 workflow 级不可用，
    # 写在上面会让整个工作流文件校验失败（一个 job 都不会跑）。
    concurrency:
      group: android-apk-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      # 8.5.3 的 android 启动链（PyConfig -> Py_RunMain）在本机会静默返回，
      # 先用 8.4.1 验证是不是版本侧的回归；确认后可以再回 8.5.x。
      RENPY_VERSION: "8.4.1"
      PYTHONUNBUFFERED: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      # 冒烟模式：最小游戏 + 独立包名（org.toeatagod.smoke），可与正式包共存
      IS_SMOKE: ${{ matrix.smoke }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show preinstalled Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | head
          ls "$ANDROID_HOME/build-tools"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version || true
          java -version

      - name: Cache Ren'Py SDK + RAPT
        id: sdkcache
        if: inputs.clean_build != true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/renpy
          key: renpy-sdk-${{ env.RENPY_VERSION }}-${{ runner.os }}
          restore-keys: |
            renpy-sdk-${{ env.RENPY_VERSION }}-

      - name: Download Ren'Py SDK + RAPT
        if: steps.sdkcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://www.renpy.org/dl/${RENPY_VERSION}"
          curl -fL --retry 3 --retry-delay 5 -o sdk.zip  "${base}/renpy-${RENPY_VERSION}-sdk.zip"
          curl -fL --retry 3 --retry-delay 5 -o rapt.zip "${base}/renpy-${RENPY_VERSION}-rapt.zip"
          unzip -q sdk.zip
          mv "renpy-${RENPY_VERSION}-sdk" renpy
          # rapt 包内自带预编译的 librenpython.so（arm64-v8a / armeabi-v7a / x86_64），
          # 不需要 NDK。
          unzip -q rapt.zip -d renpy
          chmod +x renpy/renpy.sh renpy/rapt/prototype/gradlew
          echo "$ANDROID_HOME" > renpy/rapt/sdk.txt
          ls -la renpy | head
          ls renpy/rapt

      - name: Patch RAPT with runtime diagnostics
        # 在 PythonSDLActivity.preparePython() 里加几行日志，把 getFilesDir() 的清单
        # 和 ANDROID_PRIVATE/ANDROID_PUBLIC 打到 logcat 的 python 标签上。
        # 同时删掉 rapt/project，强制 copy_project() 用打过补丁的 prototype 重建。
        run: |
          set -euo pipefail
          python3 scripts/patch_rapt_java.py "$RENPY_SDK/rapt"
          rm -rf "$RUNNER_TEMP/renpy/rapt/project"
          grep -c "DGENV ANDROID_PRIVATE" \
            "$RENPY_SDK/rapt/prototype/renpyandroid/src/main/java/org/renpy/android/PythonSDLActivity.java"
        env:
          RENPY_SDK: ${{ runner.temp }}/renpy

      - name: Restore keystore (optional)
        # 想在两次构建之间"覆盖安装"，必须用同一个签名。把 keystore 存成 secret
        # ANDROID_KEYSTORE_B64（base64），否则每次构建会生成一把临时钥匙。
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android.keystore
            echo "keystore restored from secret"
          else
            rm -f android.keystore
            echo "::notice::没有 ANDROID_KEYSTORE_B64 secret，将生成临时签名（新包需卸载旧包才能安装）"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Prepare smoke game (only when smoke=1)
        if: env.IS_SMOKE == '1'
        run: |
          set -euo pipefail
          python3 scripts/make_smoke_game.py game "$RUNNER_TEMP/smoke_game"

      - name: Compile game scripts (.rpyc)
        # rapt 的 blocklist.txt 会把 **.rpy 排除出 APK，只打包 .rpyc。
        # 所以必须先编译：既生成 game/android_compat.rpy 的 .rpyc，
        # 也顺便验证整份脚本能被 Ren'Py 正常加载。
        # --keep-orphan-rpyc 必须加：game/tl/espanol/*.rpyc 没有同名 .rpy，
        # 不加会被当成孤儿删掉（西语文本是原作语言）。
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          SRC="game"
          if [ "$IS_SMOKE" = "1" ]; then SRC="$RUNNER_TEMP/smoke_game"; fi
          echo "打包源: $SRC ($(du -sh "$SRC" | cut -f1))"
          rm -rf "$RUNNER_TEMP/compile"
          mkdir -p "$RUNNER_TEMP/compile" "$RUNNER_TEMP/saves"
          cp -a "$SRC" "$RUNNER_TEMP/compile/game"
          cd "$RUNNER_TEMP/renpy"
          ./renpy.sh --savedir "$RUNNER_TEMP/saves" "$RUNNER_TEMP/compile" \
            compile --keep-orphan-rpyc
          echo "--- compiled rpyc count ---"
          find "$RUNNER_TEMP/compile/game" -name '*.rpyc' | wc -l
          if [ "$IS_SMOKE" != "1" ]; then
            ls -la "$RUNNER_TEMP/compile/game/android_compat.rpyc"
          fi

      - name: Show Ren'Py log on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/compile/log.txt" "$RUNNER_TEMP/compile/traceback.txt" \
                   "$RUNNER_TEMP/compile/errors.txt"; do
            [ -f "$f" ] && { echo "=== $f ==="; tail -80 "$f"; }
          done

      - name: Build APK with the official launcher
        # 不再手搓 dist：交给 Ren'Py 自己的 Distributor 生成（renpy.sh launcher
        # android_build）。手搓那份虽然结构看起来对（private.mp3 里有 main.py、
        # renpy/、lib/），但 8.4.1 和 8.5.3 上都出现"main.py 不被执行、Activity
        # 600ms 后自动退出"，说明缺的是 Distributor 才会补的东西。
        env:
          RENPY_SDK: ${{ runner.temp }}/renpy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          PROJ="$RUNNER_TEMP/proj"
          rm -rf "$PROJ" "$GITHUB_WORKSPACE/out"
          mkdir -p "$PROJ" "$GITHUB_WORKSPACE/out"
          cp -a "$RUNNER_TEMP/compile/game" "$PROJ/game"
          if [ "$IS_SMOKE" = "1" ]; then
            cp -a "$GITHUB_WORKSPACE/android.smoke.json" "$PROJ/android.json"
          else
            cp -a "$GITHUB_WORKSPACE/android.json" "$PROJ/android.json"
          fi
          # 官方路径用 <project>/android.keystore 签名
          if [ -f "$GITHUB_WORKSPACE/android.keystore" ]; then
            cp -a "$GITHUB_WORKSPACE/android.keystore" "$PROJ/android.keystore"
          else
            keytool -genkeypair -keystore "$PROJ/android.keystore" -alias android \
              -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass android -keypass android \
              -dname "CN=ToEataGod port,O=Port,C=CN"
          fi
          echo "$ANDROID_HOME" > "$RENPY_SDK/rapt/sdk.txt"
          rm -rf "$RENPY_SDK/rapt/project" "$RENPY_SDK/rapt/bin"
          cd "$RENPY_SDK"
          xvfb-run -a ./renpy.sh launcher android_build "$PROJ" \
            --destination "$GITHUB_WORKSPACE/out"
          echo "--- out ---"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Publish diagnostics on failure
        # GitHub 的 job 日志需要鉴权，读不到；把 traceback / log 打成 Release 资产，
        # 这样排查时可以直接用 API 拉下来看，不必让人去网页里翻。
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          D="$RUNNER_TEMP/diag"
          rm -rf "$D"; mkdir -p "$D"
          for f in "$RUNNER_TEMP/proj/log.txt" "$RUNNER_TEMP/proj/traceback.txt" \
                   "$RUNNER_TEMP/proj/errors.txt" \
                   "$RUNNER_TEMP/compile/log.txt" "$RUNNER_TEMP/compile/traceback.txt" \
                   "$RUNNER_TEMP/compile/errors.txt" \
                   "$RUNNER_TEMP/renpy/rapt/project/log.txt"; do
            if [ -f "$f" ]; then
              cp "$f" "$D/$(echo "$f" | sed 's|/|_|g')"
            fi
          done
          find "$RUNNER_TEMP/proj" -maxdepth 2 -name "*.txt" 2>/dev/null | while read -r f; do
            cp "$f" "$D/proj_$(basename "$f")" 2>/dev/null
          done
          ls -la "$D"
          if [ -z "$(ls -A "$D")" ]; then echo "no diagnostics captured" > "$D/EMPTY.txt"; fi
          TAG="diag-${GITHUB_RUN_NUMBER}-${IS_SMOKE}"
          gh release create "$TAG" "$D"/* --title "diagnostics $TAG" \
            --notes "自动化失败诊断（run ${GITHUB_RUN_NUMBER}, smoke=${IS_SMOKE}）" \
            --target "$GITHUB_SHA" || gh release upload "$TAG" "$D"/* --clobber

      - name: Show RAPT log on failure
        if: failure()
        run: |
          set +e
          for f in "$RUNNER_TEMP/renpy/rapt/project/log.txt" \
                   "$RUNNER_TEMP/compile/log.txt"; do
            if [ -f "$f" ]; then echo "=== $f ==="; tail -120 "$f"; fi
          done
          echo "=== gradle outputs ==="
          find "$RUNNER_TEMP/renpy/rapt/project/app/build/outputs" -maxdepth 3 2>/dev/null | head -20
          echo "=== disk ==="
          df -h "$RUNNER_TEMP" | tail -1

      - name: Verify and summarize APK
        id: apk
        run: |
          set -euo pipefail
          # 按包名精确挑，绝不用"最大的那个"——曾经因此把 777MB 的全量包
          # 挂到了冒烟包的 Release 上。
          if [ "$IS_SMOKE" = "1" ]; then PKG=org.toeatagod.smoke; else PKG=org.toeatagod.port; fi
          echo "期望包名: $PKG"
          ls -l out/ || true
          APK=$(ls out/${PKG}-*.apk | head -n1)
          echo "选中: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "size_mb=$(( $(stat -c%s "$APK") / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "--- signing certificate ---"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -12
          echo "--- manifest (badging) ---"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -8 || true
          echo "--- native libs ---"
          unzip -l "$APK" | grep -c 'lib/.*librenpython.so' || true
          {
            echo "### APK 构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`$(basename "$APK")\` |"
            echo "| 大小 | $(( $(stat -c%s "$APK") / 1024 / 1024 )) MB |"
            echo "| SHA256 | \`$(cut -d' ' -f1 "$APK.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        # 大体积产物走 artifact 有可能触顶，失败不阻塞；下面还有 Release 兜底。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: toeatagod-apk-${{ matrix.name }}-${{ github.run_number }}
          path: out/*.apk
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$IS_SMOKE" = "1" ]; then PKG=org.toeatagod.smoke; else PKG=org.toeatagod.port; fi
          APK=$(ls out/${PKG}-*.apk | head -n1)
          case "$(basename "$APK")" in
            ${PKG}-*) ;;
            *) echo "::error::APK 名称与期望包名不符: $APK"; exit 1 ;;
          esac
          if [ "$IS_SMOKE" = "1" ]; then
            TAG="smoke-build-${GITHUB_RUN_NUMBER}"
            TITLE="ToEataGod SMOKE #${GITHUB_RUN_NUMBER}"
            NOTES="冒烟包（最小游戏 + Python 探针），用于排查启动问题，不是正式包。大小 $(du -h "$APK" | cut -f1)。"
          else
            TAG="android-build-${GITHUB_RUN_NUMBER}"
            TITLE="To Eat a God 3.0 (Android) #${GITHUB_RUN_NUMBER}"
            NOTES="To Eat a God 3.0 —— Android 移植包（未翻译，原作西语）。大小 $(du -h "$APK" | cut -f1)。"
          fi
          echo "发布 $TAG <- $APK ($(du -h "$APK" | cut -f1))"
          if ! gh release create "$TAG" "$APK" "$APK.sha256" \
                --title "$TITLE" \
                --notes "$NOTES" \
                --target "$GITHUB_SHA"; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          fi
          gh release view "$TAG" --json url -q .url | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean up big scratch dirs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dist" "$RUNNER_TEMP/renpy/rapt/project/app/build/intermediates" || true
          df -h "$RUNNER_TEMP" | tail -1
